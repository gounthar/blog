---
name: "Update Hugo Docker image tag"

scms:
  default:
    kind: github
    spec:
      owner: gounthar
      repository: blog
      branch: main
      user: "{{ .github.user }}"
      token: "{{ .github.token }}"

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: "chore(deps): update Hugo Docker image"
      labels:
        - dependencies
        - docker

sources:
  hugo-image:
    name: "Get latest hugomods/hugo tag"
    kind: dockerimage
    spec:
      image: hugomods/hugo
      tagfilter: "^\\d+\\.\\d+\\.\\d+$"
      versionfilter:
        kind: semver

targets:
  hugo-dockerfile:
    name: "Update Hugo base image in docker/hugo.Dockerfile"
    kind: dockerfile
    scmid: default
    sourceid: hugo-image
    spec:
      file: docker/hugo.Dockerfile
      instruction:
        keyword: "FROM"
        matcher: "hugomods/hugo"
