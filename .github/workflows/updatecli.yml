name: UpdateCLI

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install UpdateCLI
        uses: updatecli/updatecli-action@v2

      - name: Run UpdateCLI
        run: updatecli pipeline apply --config updatecli.d/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATECLI_GITHUB_USER: gounthar

      # PRs opened with GITHUB_TOKEN trigger no workflow runs, so the
      # bump PRs would show no build check at all. Dispatching is allowed
      # with GITHUB_TOKEN, and the run's checks land on the PR's head commit.
      - name: Run the build on open updatecli PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
            --author app/github-actions \
            --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName' \
            | grep '^updatecli_' \
            | while read -r branch; do
                echo "Dispatching build.yml on ${branch}"
                gh workflow run build.yml --repo "${GITHUB_REPOSITORY}" \
                  --ref "${branch}"
              done
