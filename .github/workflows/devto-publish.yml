---
name: Publish new posts to dev.to

"on":
  push:
    branches:
      - main
    paths:
      - 'content/posts/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Ruby and Asciidoctor
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Asciidoctor
        run: gem install asciidoctor --no-document

      - name: Install Pandoc
        run: sudo apt-get update -q && sudo apt-get install -y pandoc

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Publish to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_POSTS_DIR: ${{ github.workspace }}/content/posts
        run: python3 scripts/devto-crosspost.py

      - name: Preserve IDs from any open ID-map PR
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          # A prior run may have proposed IDs on chore/devto-ids-update that are
          # not on main yet. Merge them in so this run (checked out from main)
          # does not drop them; current values win on any overlap.
          if git fetch origin chore/devto-ids-update; then
            git show origin/chore/devto-ids-update:scripts/devto-ids.json \
              > /tmp/prev-devto-ids.json
            jq -s '.[0] * .[1]' /tmp/prev-devto-ids.json \
              scripts/devto-ids.json > /tmp/merged-devto-ids.json
            mv /tmp/merged-devto-ids.json scripts/devto-ids.json
          fi

      - name: Open PR for updated ID map
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: scripts/devto-ids.json
          branch: chore/devto-ids-update
          delete-branch: true
          commit-message: "chore: update devto-ids.json"
          title: "chore: update dev.to ID map"
          body: |
            Automated update of `scripts/devto-ids.json` after publishing
            new post(s) to dev.to.

            Merging this records the dev.to IDs the API assigned, so the next
            run recognises those posts as already published and does not
            create duplicates. Direct pushes to `main` are blocked by branch
            protection, so the map is proposed as a PR instead.
